<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>JeonseGuard Admin Monitor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px;
    }
    h1, h2, h3 {
      margin: 0 0 12px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .btn {
      border: 0;
      background: #1f4fd7;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }
    .btn:disabled {
      background: #9aa7c7;
      cursor: not-allowed;
    }
    .btn.secondary {
      background: #4b5563;
    }
    .btn.danger {
      background: #c62828;
    }
    .grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 20px;
    }
    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .stat {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
    }
    .stat .label {
      font-size: 12px;
      color: #666;
      margin-bottom: 6px;
    }
    .stat .value {
      font-size: 24px;
      font-weight: bold;
    }
    .upload-box {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="file"], input[type="text"], select {
      padding: 9px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      background: white;
    }
    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: top;
    }
    th {
      background: #f8fafc;
      font-size: 13px;
    }
    tr:hover {
      background: #f9fbff;
      cursor: pointer;
    }
    .detail-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.6;
      border: 1px solid #e5e7eb;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 300px;
    }
    .log-box {
      background: #111827;
      color: #e5e7eb;
      border-radius: 12px;
      padding: 12px;
      font-size: 13px;
      white-space: pre-wrap;
      min-height: 150px;
      max-height: 250px;
      overflow: auto;
    }
    .small {
      font-size: 12px;
      color: #666;
    }
    .row-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      background: #e8eefc;
      color: #1e40af;
      margin-right: 6px;
    }
    @media (max-width: 1000px) {
      .grid {
        grid-template-columns: 1fr;
      }
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>JeonseGuard 관리자 모니터링</h1>
        <div class="small">업로드 → 목록 조회 → 상세 확인 → 재처리 시연용 페이지</div>
      </div>
      <button class="btn secondary" onclick="refreshAll()">새로고침</button>
    </div>

    <div class="card">
      <h2>문서 업로드</h2>
      <div class="upload-box">
        <input type="file" id="fileInput" />
        <select id="sourceInput">
          <option value="pdf">pdf</option>
          <option value="mobile_scan">mobile_scan</option>
          <option value="mobile_gallery">mobile_gallery</option>
        </select>
        <input type="text" id="userIdInput" placeholder="user_id (선택)" />
        <button class="btn" onclick="uploadDocument()">업로드</button>
      </div>
      <div class="small" style="margin-top:10px;">
        발표 시에는 PDF 한 개를 업로드한 뒤 바로 아래 문서 목록에서 확인하면 됩니다.
      </div>
    </div>

    <div class="card">
      <h2>대시보드 요약</h2>
      <div class="stats" id="summaryStats"></div>
    </div>

    <div class="grid">
      <div>
        <div class="card">
          <h2>문서 목록</h2>
          <div class="filters">
            <select id="statusFilter">
              <option value="">status 전체</option>
              <option value="uploaded">uploaded</option>
              <option value="text_extracted">text_extracted</option>
              <option value="analysis_pending">analysis_pending</option>
              <option value="analysis_completed">analysis_completed</option>
              <option value="report_ready">report_ready</option>
              <option value="failed">failed</option>
              <option value="deleted">deleted</option>
            </select>
            <select id="hasErrorFilter">
              <option value="">error 전체</option>
              <option value="true">error 있음</option>
              <option value="false">error 없음</option>
            </select>
            <button class="btn secondary" onclick="loadDocuments()">필터 적용</button>
          </div>

          <table>
            <thead>
              <tr>
                <th>document_id</th>
                <th>file_name</th>
                <th>status</th>
                <th>analysis_status</th>
                <th>retry_count</th>
                <th>quality</th>
                <th>created_at</th>
              </tr>
            </thead>
            <tbody id="documentTableBody"></tbody>
          </table>
        </div>
      </div>

      <div>
        <div class="card">
          <h2>문서 상세</h2>
          <div id="detailBadges" style="margin-bottom:10px;"></div>
          <div class="detail-box" id="detailBox">왼쪽 목록에서 문서를 선택하십시오.</div>
          <div class="row-actions">
            <button class="btn" id="retryOcrBtn" onclick="retryOCR()" disabled>OCR 재처리</button>
            <button class="btn secondary" id="retryAnalysisBtn" onclick="retryAnalysis()" disabled>분석 재처리</button>
          </div>
        </div>

        <div class="card">
          <h2>실행 로그</h2>
          <div class="log-box" id="logBox"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = "/api";
    let selectedDocumentId = null;

    function log(message) {
      const logBox = document.getElementById("logBox");
      const timestamp = new Date().toLocaleTimeString();
      logBox.textContent = `[${timestamp}] ${message}\n` + logBox.textContent;
    }

    function formatValue(value) {
      if (value === null || value === undefined || value === "") return "-";
      if (typeof value === "object") return JSON.stringify(value, null, 2);
      return String(value);
    }

    function formatDate(value) {
      if (!value) return "-";
      return value.replace("T", " ").replace("Z", "");
    }

    async function apiFetch(url, options = {}) {
      const response = await fetch(url, options);
      if (!response.ok) {
        let message = `HTTP ${response.status}`;
        try {
          const data = await response.json();
          if (data.detail) message += ` - ${data.detail}`;
        } catch (_) {}
        throw new Error(message);
      }
      return response.json();
    }

    async function loadSummary() {
      const data = await apiFetch(`${API_BASE}/admin/dashboard/summary`);
      const stats = [
        ["전체 문서", data.total_documents],
        ["업로드 완료", data.uploaded_documents],
        ["텍스트 추출 완료", data.text_extracted_documents],
        ["분석 대기", data.analysis_pending_documents],
        ["분석 완료", data.analysis_completed_documents],
        ["실패 문서", data.failed_documents],
        ["오류 문서", data.documents_with_errors],
        ["삭제 예정", data.documents_scheduled_for_deletion],
        ["평균 OCR 품질", data.average_extracted_text_quality],
        ["총 재시도 수", data.total_retry_count],
      ];

      const html = stats.map(([label, value]) => `
        <div class="stat">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
        </div>
      `).join("");

      document.getElementById("summaryStats").innerHTML = html;
      log("대시보드 요약을 갱신했습니다.");
    }

    async function loadDocuments() {
      const status = document.getElementById("statusFilter").value;
      const hasError = document.getElementById("hasErrorFilter").value;

      const params = new URLSearchParams();
      if (status) params.append("status", status);
      if (hasError) params.append("has_error", hasError);

      const url = `${API_BASE}/admin/documents${params.toString() ? `?${params.toString()}` : ""}`;
      const data = await apiFetch(url);

      const tbody = document.getElementById("documentTableBody");
      tbody.innerHTML = "";

      if (!data.items || data.items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7">문서가 없습니다.</td></tr>`;
        log("문서 목록이 비어 있습니다.");
        return;
      }

      data.items.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.document_id}</td>
          <td>${item.file_name}</td>
          <td>${item.status}</td>
          <td>${item.analysis_status}</td>
          <td>${item.retry_count}</td>
          <td>${item.extracted_text_quality ?? "-"}</td>
          <td>${formatDate(item.created_at)}</td>
        `;
        tr.onclick = () => loadDetail(item.document_id);
        tbody.appendChild(tr);
      });

      log(`문서 목록 ${data.total}건을 조회했습니다.`);
    }

    async function loadDetail(documentId) {
      const data = await apiFetch(`${API_BASE}/admin/documents/${documentId}`);
      selectedDocumentId = documentId;

      const badgeHtml = `
        <span class="badge">status: ${data.status}</span>
        <span class="badge">analysis: ${data.analysis_status}</span>
        <span class="badge">report: ${data.report_status}</span>
      `;
      document.getElementById("detailBadges").innerHTML = badgeHtml;

      const text = [
        `document_id: ${formatValue(data.document_id)}`,
        `request_id: ${formatValue(data.request_id)}`,
        `user_id: ${formatValue(data.user_id)}`,
        `file_name: ${formatValue(data.file_name)}`,
        `file_path: ${formatValue(data.file_path)}`,
        `sha256: ${formatValue(data.sha256)}`,
        `content_type: ${formatValue(data.content_type)}`,
        `source: ${formatValue(data.source)}`,
        `status: ${formatValue(data.status)}`,
        `ocr_engine: ${formatValue(data.ocr_engine)}`,
        `analysis_provider: ${formatValue(data.analysis_provider)}`,
        `analysis_status: ${formatValue(data.analysis_status)}`,
        `report_status: ${formatValue(data.report_status)}`,
        `retry_count: ${formatValue(data.retry_count)}`,
        `max_retry_count: ${formatValue(data.max_retry_count)}`,
        `last_error: ${formatValue(data.last_error)}`,
        `last_error_at: ${formatDate(data.last_error_at)}`,
        `next_retry_at: ${formatDate(data.next_retry_at)}`,
        `processing_started_at: ${formatDate(data.processing_started_at)}`,
        `processing_finished_at: ${formatDate(data.processing_finished_at)}`,
        `extracted_text_quality: ${formatValue(data.extracted_text_quality)}`,
        `deletion_scheduled_at: ${formatDate(data.deletion_scheduled_at)}`,
        `created_at: ${formatDate(data.created_at)}`,
        `updated_at: ${formatDate(data.updated_at)}`
      ].join("\n");

      document.getElementById("detailBox").textContent = text;
      document.getElementById("retryOcrBtn").disabled = false;
      document.getElementById("retryAnalysisBtn").disabled = false;

      log(`문서 상세를 조회했습니다. document_id=${documentId}`);
    }

    async function uploadDocument() {
      const fileInput = document.getElementById("fileInput");
      const sourceInput = document.getElementById("sourceInput");
      const userIdInput = document.getElementById("userIdInput");

      if (!fileInput.files.length) {
        alert("업로드할 파일을 선택하십시오.");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("source", sourceInput.value);
      if (userIdInput.value.trim()) {
        formData.append("user_id", userIdInput.value.trim());
      }

      try {
        const data = await apiFetch(`${API_BASE}/documents/upload`, {
          method: "POST",
          body: formData
        });
        log(`문서 업로드 성공. document_id=${data.document_id}`);
        await refreshAll();
        await loadDetail(data.document_id);
      } catch (error) {
        log(`문서 업로드 실패: ${error.message}`);
        alert(error.message);
      }
    }

    async function retryOCR() {
      if (!selectedDocumentId) {
        alert("문서를 먼저 선택하십시오.");
        return;
      }
      try {
        const data = await apiFetch(`${API_BASE}/admin/documents/${selectedDocumentId}/retry-ocr`, {
          method: "POST"
        });
        log(`OCR 재처리 완료. retry_count=${data.retry_count}`);
        await refreshAll();
        await loadDetail(selectedDocumentId);
      } catch (error) {
        log(`OCR 재처리 실패: ${error.message}`);
        alert(error.message);
      }
    }

    async function retryAnalysis() {
      if (!selectedDocumentId) {
        alert("문서를 먼저 선택하십시오.");
        return;
      }
      try {
        const data = await apiFetch(`${API_BASE}/admin/documents/${selectedDocumentId}/retry-analysis`, {
          method: "POST"
        });
        log(`분석 재처리 완료. retry_count=${data.retry_count}`);
        await refreshAll();
        await loadDetail(selectedDocumentId);
      } catch (error) {
        log(`분석 재처리 실패: ${error.message}`);
        alert(error.message);
      }
    }

    async function refreshAll() {
      try {
        await loadSummary();
        await loadDocuments();
      } catch (error) {
        log(`화면 갱신 실패: ${error.message}`);
      }
    }

    refreshAll();
  </script>
</body>
</html>
